<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedusaXD Claude Bot — Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #1a1a1a;
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        text-align: center;
      }
      .subtitle {
        color: #888;
        text-align: center;
        margin-bottom: 32px;
        font-size: 14px;
      }
      .emoji {
        font-size: 48px;
        text-align: center;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #aaa;
        margin-bottom: 6px;
        margin-top: 16px;
      }
      input {
        width: 100%;
        padding: 12px 16px;
        background: #2a2a2a;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        font-size: 15px;
        outline: none;
      }
      input:focus {
        border-color: #5b8def;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #5b8def;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 24px;
        transition: background 0.2s;
      }
      button:hover {
        background: #4a7de0;
      }
      .error {
        color: #ef5b5b;
        font-size: 13px;
        margin-top: 12px;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">🧬</div>
      <h1>MedusaXD Claude Bot</h1>
      <p class="subtitle">Admin Panel</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          required
        />
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Sign In</button>
        <p class="error" id="error"></p>
      </form>
    </div>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errEl = document.getElementById("error");
          errEl.style.display = "none";

          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value,
              password: document.getElementById("password").value,
            }),
          });

          if (res.ok) {
            window.location.href = "/";
          } else {
            errEl.textContent = "Invalid credentials";
            errEl.style.display = "block";
          }
        });
    </script>
  </body>
</html>
